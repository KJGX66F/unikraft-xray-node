# 在 GitHub Actions 里直接打 Unikraft 镜像，不用本地装 CLI / Docker。
#
# 用途：把本仓库的 Dockerfile + Kraftfile 打包成 Unikraft 镜像，
# 推到 Unikraft 中央仓库 index.unikraft.io/<你的组织>/<仓库名>:latest，
# （镜像名取自仓库名，fork 改名后自动跟着变），
# 打完控制台 New Instance 的 Image 下拉框里就能选到它。
#
# 触发：只手动触发（Actions → Build Unikraft image → Run workflow），
# 不在每次 push 时自动跑，避免没有配 token 的 fork 每次都跑失败。
#
# 前置条件（只做一次，2 分钟）：
#   1. 在 Unikraft Cloud 控制台里创建一个 API token。
#   2. 在 GitHub 仓库 Settings → Secrets and variables → Actions → New repository secret，
#      名字填 UKC_TOKEN，值粘贴那个 token。
#   注意：这个 token 权限很大，能创建、停止、删除你账号下的实例和卷，
#   只放进仓库 Secrets（加密保存，不会显示在日志里），绝不要贴到聊天、Issue 或代码里。
#   万一泄露，立刻去控制台吊销并重新生成。
#
# Fork 的人：同样加自己的 UKC_TOKEN 秘密，Run workflow 时 org 留空就行，
# workflow 会从 token 自动识别那个账号的组织，镜像就进他自己的仓库。
name: Build Unikraft image

on:
  workflow_dispatch:
    inputs:
      org:
        description: "Unikraft 组织名（留空自动识别，推荐；自动识别失败时再填）"
        required: false
        default: ""
      tag:
        description: "镜像标签"
        required: true
        default: "latest"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Unikraft CLI
        run: curl --proto '=https' --tlsv1.2 -fsSL https://unikraft.com/cli/install.sh | sh

      # 新版 CLI 的非交互登录：token 写进一个文件，再用 --token 指过去。
      # 不用在日志里出现 token 的值；文件只存在这一步的 runner 里。
      # 组织自动识别：登录成功后 CLI 会把组织写进配置文件，从那里读出来，
      # 换别的账号也不用改 workflow；读不到时才用手动填的 org 输入。
      # 登录失败重试 3 次：到控制平面的 TLS 握手偶尔超时，重跑一般就过。
      - name: Log in and detect organization
        id: login
        run: |
          trap 'rm -f /tmp/ukc-token' EXIT
          printf '%s' "${{ secrets.UKC_TOKEN }}" > /tmp/ukc-token
          chmod 600 /tmp/ukc-token
          ok=0
          for i in 1 2 3; do
            if unikraft login --token /tmp/ukc-token; then ok=1; break; fi
            echo "登录失败，10 秒后重试（第 $i/3 次）…"
            sleep 10
          done
          test "$ok" = 1
          ORG=$(awk '/^[[:space:]]*organization:/ {print $2; exit}' ~/.config/unikraft/config.yaml | tr -d '"')
          if [ -z "$ORG" ]; then ORG="${{ inputs.org }}"; fi
          if [ -z "$ORG" ]; then
            echo "::error::无法自动识别组织：请在 Run workflow 时填写 org（Unikraft 控制台左上角的组织名）"
            exit 1
          fi
          unikraft login --token /tmp/ukc-token --organization "$ORG"
          echo "org=$ORG" >> "$GITHUB_OUTPUT"
          echo "识别到的组织：$ORG"
          # 镜像名取仓库名（GITHUB_REPOSITORY 是 所有者/仓库名），fork 改名后自动跟着变。
          REPO="${GITHUB_REPOSITORY##*/}"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "镜像：$ORG/$REPO:${{ inputs.tag }}"

      - name: Build and push Unikraft image
        run: unikraft build . --output ${{ steps.login.outputs.org }}/${{ steps.login.outputs.repo }}:${{ inputs.tag }}

      # 只做展示：列一下仓库里的镜像。控制平面偶尔 TLS 超时，失败也不影响
      # 已经推好的镜像，所以吞掉错误，只打印一行提示。
      - name: Show image
        run: unikraft images list || echo "（镜像列表这次没刷出来，属控制平面网络超时；镜像本身已推好，不影响使用）"
